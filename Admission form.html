 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REPORT FORM</title>
</head>
<body>
    <form>
    <table border="1">
        <tr>
            <th colspan="2" align="centre">Report form</th>
        </tr>
        <tr>
            <th colspan="2" align="centre">Information table</th>
        </tr>
        <tr>
            <td>
            <label for="fname">Name:</label>
            </td>
            <td>
            <input type="Text" id="fname" name="fname" placeholder="Enter your name here">
            </td>
            <br>
        </tr>
        <tr>
            <td>
            <label for="emaill">Email:</label>
            </td>
            <td>
            <input type="email" id="emaill" name="emaill" placeholder="Enter your email here">
            </td>
            <br>
        </tr>
        <tr>
            <td>
            <label for="passwordd"> Password: </label> 
            </td>
            <td>
            <input type="Password" id="passwordd" name="passwordd" placeholder="Enter your password here">
            </td>
            <br>
        </tr>
        <tr>
            <td>
                <label for="haddress">Permanent Address</label>
            </td>
            <td>
                <input type="permanent address" id="haddress" name="homeaddress" placeholder="Enter your address here ">
            </td>
            <br>
        </tr>
        <tr>
            <td>
                <label for="countryy">Country:</label>
            </td>
            <td>
                <input type="selecte country" id="countryy" name="countryy" value="Pakistan"> 
            </td>
            <br>
        </tr>
        <tr>
            <!-- select your gender -->
            <td>
                <label for="genderr">Gender: </label>
            </td>
            <td>
                <input type="radio" id="female" name="Gender">
                <label for="gender">Female</label>
                <input type="radio" id="male" name="Gender">
                <label for="gender">Male</label>
            </td>
            <br>
        </tr>
        <tr>
            <td>
                <label for="hobbiess">Hobbies:</label>
            </td>
            <td>
                <input type="checkbox" id="hobbiess" name="hobbiess">
                <label for="hobbiess">Reading</label>
            <br>
                <input type="checkbox" id="hobbiess" name="hobbiess">
                <label for="hobbiess">Listening Music</label>
            <br>
                <input type="checkbox" id="hobbiess" name="hobbiess">
                <label for="hobbiess">Swimming</label>
            <br>
                <input type="checkbox" id="hobbiess" name="hobbiess">
                <label for="hobbiess">Gardening</label>
            <br>
                <input type="checkbox" id="hobbiess" name="hobbiess">
                <label for="hobbiess">Athletics</label>
            <br>
            </td>
        </tr>
        <tr>
            <td>
                Your Web site
            </td>
            <td>
                <input type="text" placeholder="http://">
                <small>PROVIDE YOUR WEBSITE URL IF EXISTS</small>
            </td>
        </tr>
        <tr>
            <td>
                Other Information About You
            </td>
            <td>
                <textarea rows="4" placeholder="WRITE ANY OTHER INFORMATION THAT IS NOT PLRESENT HERE"></textarea>
            </td>
        </tr>
        <tr class="bottons">
            <td colspan="2">
                <input type="submit" placeholder="SEND IN MY REPORT">
            </td>
            <td>
                <input type="reset"  placholder="ERASE FROM REPORT FORM">
            </td>
        </tr>
    </table>
    </form>
</body>
</html>
